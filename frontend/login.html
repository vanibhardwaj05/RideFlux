<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - RideFlux</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="auth-shell">
    <div class="container auth-layout">
      <section class="card auth-promo">
        <div>
          <a href="./index.html" class="logo">
            <span class="logo-mark">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
                <circle cx="7" cy="17" r="2"/>
                <path d="M9 17h6"/>
                <circle cx="17" cy="17" r="2"/>
              </svg>
            </span>
            RideFlux
          </a>
          <p class="eyebrow mt-6">Login</p>
          <h1 class="section-title">Access your dashboard.</h1>
          <p class="lead mt-4">Sign in to continue to passenger, cab driver, or bus driver operations.</p>
        </div>

        <div class="auth-visual-stack">
          <div class="card" style="padding: 1rem;">
            <span class="surface-tag">Cab</span>
            <img src="./assets/car-hero.svg" alt="Cab artwork" class="vehicle-image">
          </div>
          <div class="card" style="padding: 1rem;">
            <span class="surface-tag">Bus</span>
            <img src="./assets/bus-hero.svg" alt="Bus artwork" class="vehicle-image">
          </div>
        </div>
      </section>

      <section class="card auth-panel">
        <div>
          <p class="eyebrow">Login</p>
          <h2>Welcome back</h2>
          <p class="form-note mt-4">Enter your account details and jump directly into the updated RideFlux dashboards.</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="passenger@test.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="password123" required>
          </div>
          <button type="submit" class="btn btn-primary w-full mt-4">Login</button>
        </form>

        <div class="auth-links">
          Don&apos;t have an account?
          <a href="./register.html"><strong>Create one here</strong></a>
        </div>
      </section>
    </div>
  </main>

  <script src="./js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const data = await fetchWithAuth('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        sessionStorage.setItem('token', data.token);
        sessionStorage.setItem('user', JSON.stringify(data.user));

        redirectBasedOnRole(data.user.role);
      } catch (error) {
        showToast(error.message, 'error');
      }
    });
  </script>
</body>
</html>
